name: Sideload Key Check

# 临时工作流：只用于确认仓库 secret SIDELOAD_KEYSTORE_BASE64 能被 Actions 正确读取，
# 校验通过后连同临时分支一起删除。只输出证书指纹等公开信息，不输出 secret 本身。
on:
  push:
    branches:
      - 'claude/sideload-key-check'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify SIDELOAD_KEYSTORE_BASE64
        env:
          SIDELOAD_KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${SIDELOAD_KEYSTORE_BASE64:-}" ]; then
            echo "::error::CHECK_FAILED=SECRET_MISSING secret SIDELOAD_KEYSTORE_BASE64 is empty or not visible to Actions"
            exit 1
          fi
          echo "secret length: ${#SIDELOAD_KEYSTORE_BASE64} chars"
          keystore="$RUNNER_TEMP/sideload.jks"
          if ! printf '%s' "$SIDELOAD_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$keystore" 2> "$RUNNER_TEMP/b64.err"; then
            echo "::error::CHECK_FAILED=BASE64_INVALID $(head -c 200 "$RUNNER_TEMP/b64.err")"
            exit 1
          fi
          echo "decoded keystore size: $(stat -c %s "$keystore") bytes"
          if ! keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/keytool.txt" 2>&1; then
            echo "::error::CHECK_FAILED=KEYSTORE_UNREADABLE keystore could not be opened with alias androiddebugkey / password android"
            head -n 3 "$RUNNER_TEMP/keytool.txt"
            exit 1
          fi
          grep -E 'Alias name|Entry type|Owner|SHA256:' "$RUNNER_TEMP/keytool.txt"
          echo "CHECK_PASSED"
