name: Android Sideload Dev Build

# 产出与官方包并存的侧载测试 APK（applicationId 带 .hsujo 后缀）。
# 刻意不注入 SIGN_KEY_*：signing.gradle 在没有签名材料时会退回
# Android debug keystore，因此本工作流不需要任何仓库 secret。
# 可选：配置了开发专用 secret SIDELOAD_KEYSTORE_BASE64（与官方 release 签名无关）时改用它签名，
# 各次构建签名一致，可直接覆盖安装；生成方法见 README「侧载开发版」。
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'claude/**'

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 固定开发密钥：secret 缺失时沿用 debug keystore；secret 存在但无效时直接失败，
      # 不会悄悄退回随机密钥（否则产出的包无法覆盖安装，问题更难发现）。
      - name: Use fixed sideload signing key (optional)
        env:
          SIDELOAD_KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${SIDELOAD_KEYSTORE_BASE64:-}" ]; then
            echo "::notice::未配置 SIDELOAD_KEYSTORE_BASE64，本次使用临时 debug 密钥签名：签名每次都不同，安装前需先卸载旧的开发版"
            exit 0
          fi
          keystore="$RUNNER_TEMP/sideload.jks"
          if ! printf '%s' "$SIDELOAD_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$keystore" 2> "$RUNNER_TEMP/b64.err"; then
            echo "::error::SIDELOAD_KEYSTORE_BASE64 不是有效的 Base64：$(head -c 200 "$RUNNER_TEMP/b64.err")"
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "::error::SIDELOAD_KEYSTORE_BASE64 无法用别名 androiddebugkey / 密码 android 打开，请按 README 重新生成"
            exit 1
          fi
          {
            echo "SIGN_KEY_STORE_FILE=$keystore"
            echo "SIGN_KEY_STORE_PASSWORD=android"
            echo "SIGN_KEY_ALIAS=androiddebugkey"
            echo "SIGN_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"
          echo "using fixed sideload signing key"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -Pturboims.debugApplicationIdSuffix=.hsujo

      - name: Build sideload debug APK
        run: ./gradlew assembleDebug -Pturboims.debugApplicationIdSuffix=.hsujo

      - name: Report APK identity
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "^package|application-label:"
          # 签名证书指纹换成与 keytool 相同的格式，方便和本地密钥核对
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          CERTS=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          # 不同 build-tools 版本的前缀不同（如 "Signer #1 certificate DN:"、"V2 Signer: certificate DN:"），
          # 只按 "certificate DN:" / "certificate SHA-256 digest:" 匹配
          DN=$(echo "$CERTS" | sed -n 's/.*certificate DN: //p' | head -n 1)
          SHA256=$(echo "$CERTS" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ -z "$SHA256" ]; then
            echo "::warning::未能从 apksigner 输出解析签名证书，原始输出如下"
            echo "$CERTS"
          fi
          echo "signing certificate DN: $DN"
          echo "signing certificate SHA256: $SHA256"
          {
            echo "### 侧载开发版"
            echo "- 签名证书：$DN"
            echo "- SHA256：\`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        run: |
          mkdir -p outputs
          cp app/build/outputs/apk/debug/app-debug.apk \
             "outputs/TurboIMS-Hsujo-Dev-${GITHUB_SHA::8}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboIMS-Hsujo-Dev
          path: outputs/*.apk
          if-no-files-found: error
