name: Android Master CI
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
      # 官方签名 secret 未配置时跳过后续步骤，避免每次合并都失败；
      # 侧载开发版由 Android Sideload Dev Build 构建，不依赖这些 secret。
      - name: Check official signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置官方签名 secret（KEYSTORE_BASE64 等），跳过官方签名构建；侧载开发版见 Android Sideload Dev Build"
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.available == 'true'
        with:
          fetch-depth: 0
      - name: set up JDK 21
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        if: steps.signing.outputs.available == 'true'
        run: chmod +x gradlew
      - name: Decode Keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/key.jks
      - name: Build with Gradle
        if: steps.signing.outputs.available == 'true'
        env:
          SIGN_KEY_STORE_FILE: "/tmp/key.jks"
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug
      - name: Upload APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TurboIMS-CI
          path: app/build/outputs/apk/debug/app-debug.apk
